[project]
name = "qip-adverse-selection"
version = "0.1.0"
description = "A study of QIP short-horizon midpoint markouts and execution costs."
authors = [
    {name = "William",email = "92939384+snowkings@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy (==2.3.5)",
    "polars (==1.44.2)",
    "matplotlib (==3.10.8)",
    "tzdata (==2026.3)",
    "imageio-ffmpeg (>=0.6.0,<0.7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
